<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Habit Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="app-header">
        <h1 class="logo-container">
            <img src="logo.jpg" alt="DAWN Habit Tracker" class="app-logo">
        </h1>
        <div class="header-controls">
            <div class="month-selector">
                <button id="prev-month" aria-label="Previous Month">&lt;</button>
                <span id="current-month-display"></span>
                <button id="next-month" aria-label="Next Month">&gt;</button>
            </div>
            <label class="theme-switch" for="theme-toggle" aria-label="Toggle Dark Mode">
                <input type="checkbox" id="theme-toggle">
                <div class="theme-switch-track">
                    <div class="clouds"></div>
                    <div class="stars"></div>
                    <div class="sun-moon-handle">
                        <div class="craters"></div>
                    </div>
                </div>
            </label>
        </div>
    </header>

    <main class="container">
        <!-- HUNTER SYSTEM WINDOW -->
        <section class="card hunter-card" style="text-align: center; position: relative; overflow: hidden;">
            <div style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: var(--color-text); opacity: 0.7;">System Interface</div>
            <div id="hunter-rank" style="font-size: 2rem; font-weight: 900; margin: 10px 0; text-transform: uppercase; text-shadow: 0 0 10px rgba(255,255,255,0.2); transition: color 0.5s;">E-RANK HUNTER</div>
            <div style="display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px;">
                <span id="hunter-xp-text">0 XP</span>
                <span id="hunter-next-rank">Next: D-Rank (100 XP)</span>
            </div>
            <div class="progress-bar-container" style="height: 12px; background: rgba(0,0,0,0.4); border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);">
                <div id="hunter-xp-fill" style="height: 100%; width: 0%; background: linear-gradient(90deg, #4a90e2, #00d2ff); border-radius: 10px; transition: width 0.8s ease-out; box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);"></div>
            </div>
        </section>

        <section class="card summary-card">
            <div class="summary-item">
                <div class="summary-label">Monthly Completion</div>
                <div class="summary-value" id="monthly-completion">0%</div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="monthly-progress-fill"></div>
                </div>
            </div>
            <div class="summary-item">
                <div class="summary-label">Current Streak</div>
                <div class="summary-value" id="current-streak">0 days</div>
            </div>
        </section>

        <section class="card habit-management">
            <input type="text" id="new-habit-input" placeholder="New habit name">
            <button id="add-habit-btn" class="btn-primary">Add habit</button>
            <button id="sort-btn" class="btn-secondary">Smart Sort</button>
            <label for="bg-upload" class="btn-secondary">Change BG</label>
            <input type="file" id="bg-upload" accept="image/*" style="display:none;">
            <button id="export-btn" class="btn-secondary">Export</button>
            <label for="import-file" class="btn-secondary">Import</label>
            <input type="file" id="import-file" accept=".json" style="display:none;">
            <div id="habit-error" class="error"></div>
        </section>

        <section class="card tracker-card">
            <div class="tracker-container">
                <table id="tracker-table">
                    <!-- Table will be generated by JS -->
                </table>
            </div>
        </section>
        <section class="card" style="margin-top: 20px;">
            <canvas id="progress-chart" height="100"></canvas>
        </section>
    </main>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
